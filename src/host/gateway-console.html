<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>sdk-bots</title>
  <style>
    :root {
      --ink: #1b211c;
      --muted: #5c675e;
      --line: #d5dcd4;
      --paper: #f3f1ea;
      --panel: #fffdf8;
      --sidebar: #243028;
      --sidebar-ink: #e8eee6;
      --sidebar-dim: #9aab9c;
      --brass: #c4a35a;
      --go: #2f6f4e;
      --go-ink: #f4fff6;
      --user: #eef2ea;
      --bot: #fff7e6;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 14px/1.45 ui-sans-serif, system-ui, "PingFang SC", "Noto Sans SC", sans-serif;
      color: var(--ink);
      background: var(--paper);
      display: grid;
      grid-template-columns: 260px 1fr;
    }
    aside {
      background: var(--sidebar);
      color: var(--sidebar-ink);
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    .brand {
      padding: 18px 16px 12px;
      border-bottom: 1px solid #334038;
    }
    .brand h1 {
      margin: 0;
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--brass);
      font-weight: 600;
    }
    .brand p { margin: 6px 0 0; color: var(--sidebar-dim); font-size: 12px; }
    .roster { flex: 1; overflow: auto; padding: 8px; }
    .item {
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: inherit;
      padding: 10px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .item:hover { background: #2e3a32; }
    .item.active { background: #3a4a3e; }
    .tag {
      font-size: 10px;
      letter-spacing: 0.08em;
      border: 1px solid #6d7c6e;
      color: var(--brass);
      padding: 1px 5px;
      border-radius: 999px;
      flex: none;
    }
    .item b { font-weight: 600; }
    .item span { display: block; color: var(--sidebar-dim); font-size: 12px; }
    .side-actions {
      padding: 12px;
      display: grid;
      gap: 8px;
      border-top: 1px solid #334038;
    }
    .side-actions button, .composer button, .dialog-actions button {
      font: inherit;
      cursor: pointer;
      border-radius: 8px;
      border: 1px solid transparent;
      padding: 8px 10px;
    }
    .ghost { background: #2e3a32; color: var(--sidebar-ink); }
    .ghost:hover { background: #3a4a3e; }
    main { display: flex; flex-direction: column; min-width: 0; }
    header.chat-head {
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
    }
    header.chat-head h2 { margin: 0; font-size: 16px; }
    header.chat-head small { color: var(--muted); }
    .log {
      flex: 1;
      overflow: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .empty { margin: auto; color: var(--muted); text-align: center; max-width: 28ch; }
    .bubble {
      max-width: 68ch;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel);
    }
    .bubble.user { align-self: flex-end; background: var(--user); }
    .bubble.bot { align-self: flex-start; background: var(--bot); }
    .bubble .who { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .composer {
      border-top: 1px solid var(--line);
      background: var(--panel);
      padding: 12px 16px 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      position: relative;
    }
    .pills {
      grid-column: 1 / -1;
      display: none;
      flex-wrap: wrap;
      gap: 6px;
    }
    .pills.show { display: flex; }
    .pill {
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 3px 10px;
    }
    .pill:hover { border-color: var(--go); color: var(--go); }
    .mention-menu {
      display: none;
      position: absolute;
      left: 16px;
      right: 88px;
      bottom: calc(100% - 4px);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(27, 33, 28, 0.12);
      overflow: hidden;
      z-index: 5;
      max-height: 220px;
      overflow-y: auto;
    }
    .mention-menu.show { display: block; }
    .mention-menu button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      font: inherit;
      padding: 8px 12px;
      cursor: pointer;
    }
    .mention-menu button:hover, .mention-menu button.active { background: var(--user); }
    .mention-menu b { font-weight: 600; }
    .mention-menu small { color: var(--muted); margin-left: 8px; }
    .bubble .mention { color: #7a5a1e; font-weight: 600; }
    textarea {
      font: inherit;
      resize: none;
      min-height: 64px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: inherit;
    }
    .go { background: var(--go); color: var(--go-ink); padding: 0 18px; }
    .go:disabled { opacity: 0.55; cursor: wait; }
    .hint {
      grid-column: 1 / -1;
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }
    dialog {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      width: min(420px, 92vw);
      background: var(--panel);
      color: inherit;
    }
    dialog::backdrop { background: rgba(27, 33, 28, 0.35); }
    dialog h3 { margin: 0 0 12px; font-size: 15px; }
    dialog label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
    dialog input[type="text"] {
      width: 100%;
      font: inherit;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .members { max-height: 180px; overflow: auto; display: grid; gap: 6px; margin: 8px 0 12px; }
    .members label { color: var(--ink); display: flex; gap: 8px; align-items: center; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .err { color: #9b2c2c; font-size: 12px; padding: 0 20px 8px; }
  </style>
</head>
<body>
  <aside>
    <div class="brand">
      <h1>sdk-bots</h1>
      <p id="status">连接中…</p>
    </div>
    <div class="roster" id="roster"></div>
    <div class="side-actions">
      <button class="ghost" id="newBot">新建 bot</button>
      <button class="ghost" id="newGroup">新建群聊</button>
    </div>
  </aside>
  <main>
    <header class="chat-head">
      <div>
        <h2 id="title">选一个 bot 或群</h2>
        <small id="subtitle">发一条消息试试</small>
      </div>
    </header>
    <div class="log" id="log">
      <div class="empty">左边选一个会话。免费模型大概 10–30 秒回一条。</div>
    </div>
    <div class="err" id="err"></div>
    <form class="composer" id="form">
      <div class="mention-menu" id="mentionMenu"></div>
      <textarea id="input" placeholder="说点什么…" disabled></textarea>
      <button class="go" id="send" disabled>发送</button>
      <div class="pills" id="pills"></div>
      <label class="hint">
        <input type="checkbox" id="nudge" />
        提醒模型只用 SendMessage 回复（需要工具时请关掉）
      </label>
    </form>
  </main>

  <dialog id="botDlg">
    <h3>新建 bot</h3>
    <label>名字</label>
    <input id="botName" type="text" placeholder="比如 研究员" />
    <label>简介</label>
    <input id="botDesc" type="text" placeholder="它擅长做什么" />
    <div class="dialog-actions">
      <button type="button" class="ghost" id="botCancel" style="background:#eee;color:inherit;border-color:var(--line)">取消</button>
      <button type="button" class="go" id="botOk">创建</button>
    </div>
  </dialog>

  <dialog id="groupDlg">
    <h3>新建群聊</h3>
    <label>群名</label>
    <input id="groupName" type="text" placeholder="比如 周末小队" />
    <label>成员</label>
    <div class="members" id="memberList"></div>
    <div class="dialog-actions">
      <button type="button" class="ghost" id="groupCancel" style="background:#eee;color:inherit;border-color:var(--line)">取消</button>
      <button type="button" class="go" id="groupOk">创建</button>
    </div>
  </dialog>

  <script>
    /*__BOOT__*/
    const TOKEN = window.SDK_BOTS_TOKEN || "";
    const $ = (id) => document.getElementById(id);
    const state = { agents: [], current: null, seen: new Set(), mention: { open: false, items: [], index: 0, start: -1 }, sending: false };

    function currentAgent() {
      return state.agents.find((a) => a.id === state.current) || null;
    }

    function currentMembers() {
      const agent = currentAgent();
      if (!agent?.isGroup) return [];
      return (agent.memberIds || []).map((id) => state.agents.find((a) => a.id === id)).filter(Boolean);
    }

    function mentionNames() {
      const names = state.agents.map((a) => a.name).filter(Boolean);
      names.push("所有人", "全员", "大家", "everyone", "all");
      return [...new Set(names)].sort((a, b) => b.length - a.length);
    }

    function mentionCandidates() {
      const agent = currentAgent();
      if (agent?.isGroup) {
        return [
          ...currentMembers().map((a) => ({ name: a.name, hint: a.description || "成员" })),
          { name: "所有人", hint: "全员回复" },
        ];
      }
      return state.agents
        .filter((a) => a.id !== state.current && a.name)
        .map((a) => ({ name: a.name, hint: a.isGroup ? "群" : "bot" }));
    }

    function mentionedAgents(text) {
      const normalized = String(text).replaceAll("＠", "@").toLowerCase();
      const hits = [];
      const seen = new Set();
      const candidates = state.agents.filter((a) => a.name).slice().sort((a, b) => b.name.length - a.name.length);
      for (let index = normalized.indexOf("@"); index >= 0; index = normalized.indexOf("@", index + 1)) {
        let cursor = index + 1;
        while (normalized[cursor] === " " || normalized[cursor] === "\t") cursor += 1;
        const rest = normalized.slice(cursor);
        let best = null;
        for (const other of candidates) {
          for (const handle of new Set([other.name.toLowerCase(), other.name.toLowerCase().replace(/\s+/g, "")])) {
            if (!rest.startsWith(handle)) continue;
            const next = rest[handle.length];
            if (/^[a-z0-9]/.test(handle) && next && /[a-z0-9_]/i.test(next)) continue;
            if (best == null || handle.length > best.length) best = { agent: other, length: handle.length };
          }
        }
        if (best && !seen.has(best.agent.id)) {
          seen.add(best.agent.id);
          hits.push(best.agent);
        }
      }
      return hits;
    }

    function escapeRegExp(value) {
      return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function fillMentionedText(el, text, names) {
      if (!names.length) {
        el.textContent = text;
        return;
      }
      const pattern = new RegExp("([@＠][ \\t]*(?:" + names.map(escapeRegExp).join("|") + "))", "gi");
      let last = 0;
      let match;
      while ((match = pattern.exec(text))) {
        if (match.index > last) el.append(text.slice(last, match.index));
        const span = document.createElement("span");
        span.className = "mention";
        span.textContent = match[0];
        el.append(span);
        last = match.index + match[0].length;
      }
      if (last < text.length) el.append(text.slice(last));
      if (last === 0) el.textContent = text;
    }

    function mentionQueryAtCaret(text, caret) {
      const before = text.slice(0, caret);
      const at = Math.max(before.lastIndexOf("@"), before.lastIndexOf("＠"));
      if (at < 0) return null;
      const between = before.slice(at + 1);
      if (between.length > 24 || !/^[ \t]*[^\s@]*$/.test(between)) return null;
      return { start: at, query: between.trimStart().toLowerCase() };
    }

    function closeMentionMenu() {
      state.mention = { open: false, items: [], index: 0, start: -1 };
      $("mentionMenu").classList.remove("show");
      $("mentionMenu").innerHTML = "";
    }

    function renderMentionMenu() {
      const box = $("mentionMenu");
      if (!state.mention.open || state.mention.items.length === 0) {
        closeMentionMenu();
        return;
      }
      box.innerHTML = "";
      state.mention.items.forEach((item, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = i === state.mention.index ? "active" : "";
        btn.innerHTML = "<b></b><small></small>";
        btn.querySelector("b").textContent = "@" + item.name;
        btn.querySelector("small").textContent = item.hint || "";
        btn.addEventListener("mousedown", (ev) => {
          ev.preventDefault();
          insertMention(item.name);
        });
        box.appendChild(btn);
      });
      box.classList.add("show");
    }

    function updateMentionMenu() {
      const input = $("input");
      const found = mentionQueryAtCaret(input.value, input.selectionStart ?? input.value.length);
      const candidates = mentionCandidates();
      if (!found || candidates.length === 0) {
        closeMentionMenu();
        return;
      }
      const items = candidates.filter((item) => !found.query || item.name.toLowerCase().includes(found.query));
      if (items.length === 0) {
        closeMentionMenu();
        return;
      }
      state.mention = { open: true, items, index: 0, start: found.start };
      renderMentionMenu();
    }

    function insertMention(name) {
      const input = $("input");
      const start = state.mention.start >= 0 ? state.mention.start : input.selectionStart;
      const caret = input.selectionStart ?? input.value.length;
      const before = input.value.slice(0, start);
      const after = input.value.slice(caret);
      const inserted = "@" + name + " ";
      input.value = before + inserted + after;
      const pos = before.length + inserted.length;
      input.setSelectionRange(pos, pos);
      closeMentionMenu();
      input.focus();
    }

    function insertAtCaret(name) {
      const input = $("input");
      const caret = input.selectionStart ?? input.value.length;
      const found = mentionQueryAtCaret(input.value, caret);
      if (found) {
        state.mention.start = found.start;
        insertMention(name);
        return;
      }
      const pad = caret > 0 && !/\s$/.test(input.value.slice(0, caret)) ? " @" : "@";
      input.setRangeText(pad + name + " ", caret, caret, "end");
      closeMentionMenu();
      input.focus();
    }

    function renderPills() {
      const box = $("pills");
      const members = currentMembers();
      box.innerHTML = "";
      if (members.length === 0) {
        box.classList.remove("show");
        return;
      }
      box.classList.add("show");
      for (const member of [...members, { name: "所有人" }]) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "pill";
        btn.textContent = "@" + member.name;
        btn.addEventListener("click", () => insertAtCaret(member.name));
        box.appendChild(btn);
      }
    }

    function headers(extra = {}) {
      return {
        "content-type": "application/json",
        ...(TOKEN ? { authorization: "Bearer " + TOKEN } : {}),
        ...extra,
      };
    }

    async function api(method, args = {}) {
      const res = await fetch("/api/" + method, {
        method: "POST",
        headers: headers(),
        body: JSON.stringify(args),
      });
      const text = await res.text();
      let json = null;
      try { json = text ? JSON.parse(text) : null; } catch { throw new Error(text.slice(0, 200)); }
      if (!res.ok || (json && json.error)) throw new Error(typeof json?.error === "string" ? json.error : JSON.stringify(json?.error || text).slice(0, 200));
      return json;
    }

    function showError(e) { $("err").textContent = e ? String(e.message || e) : ""; }

    function entryText(entry) {
      if (!entry) return "";
      if (entry.kind === "send-message") return entry.message?.content || "";
      if (entry.kind === "message") return entry.content || "";
      return "";
    }

    function entryRole(entry) {
      if (entry?.kind === "send-message") return "bot";
      if (entry?.role === "user") return "user";
      return "bot";
    }

    function renderRoster() {
      const box = $("roster");
      box.innerHTML = "";
      for (const agent of state.agents) {
        const btn = document.createElement("button");
        btn.className = "item" + (state.current === agent.id ? " active" : "");
        btn.innerHTML = `<span class="tag">${agent.isGroup ? "群" : "BOT"}</span><div><b></b><span></span></div>`;
        btn.querySelector("b").textContent = agent.name || "未命名";
        btn.querySelector("div span").textContent = agent.description || agent.id.slice(0, 8);
        btn.addEventListener("click", () => select(agent.id));
        box.appendChild(btn);
      }
    }

    function addBubble(entry, agentId) {
      if (!entry?.id || state.seen.has(entry.id)) return;
      const text = entryText(entry).trim();
      if (!text) return;
      const role = entryRole(entry);
      if (role === "user" && !String(entry.id).startsWith("local-")) {
        const pending = [...$("log").querySelectorAll(".bubble.user[data-pending='1']")]
          .find((node) => node.dataset.text === text);
        if (pending) {
          const localId = pending.dataset.entryId;
          if (localId) state.seen.delete(localId);
          state.seen.add(entry.id);
          pending.dataset.entryId = entry.id;
          pending.dataset.pending = "0";
          pending.removeAttribute("data-pending");
          return;
        }
      }
      state.seen.add(entry.id);
      const empty = $("log").querySelector(".empty");
      if (empty) empty.remove();
      const div = document.createElement("div");
      div.className = "bubble " + role;
      div.dataset.entryId = entry.id;
      div.dataset.text = text;
      if (String(entry.id).startsWith("local-")) div.dataset.pending = "1";
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = role === "user" ? "你" : (entry.author?.name || (agentId && state.agents.find(a => a.id === agentId)?.name) || "bot");
      const body = document.createElement("div");
      fillMentionedText(body, text, mentionNames());
      div.append(who, body);
      $("log").appendChild(div);
      $("log").scrollTop = $("log").scrollHeight;
    }

    async function select(id) {
      state.current = id;
      state.seen = new Set();
      const agent = state.agents.find((a) => a.id === id);
      $("title").textContent = agent?.name || "会话";
      $("subtitle").textContent = agent?.isGroup
        ? ("群聊 · 输入 @ 点名成员，或点下面的名字")
        : "单 bot";
      $("input").placeholder = agent?.isGroup
        ? "@研究员 问一件事，或不加 @ 让全员回"
        : "说点什么… 输入 @ 可切到另一个 bot";
      $("nudge").checked = false;
      $("nudge").closest("label").style.display = agent?.isGroup ? "none" : "";
      $("input").disabled = false;
      $("send").disabled = false;
      $("input").focus();
      renderRoster();
      renderPills();
      closeMentionMenu();
      $("log").innerHTML = "";
      try {
        const tail = await api("getAgentTranscriptTail", { id });
        const entries = tail?.entries || [];
        if (entries.length === 0) {
          $("log").innerHTML = '<div class="empty">还没有消息。下面输入框发一条。</div>';
        } else {
          for (const entry of entries) addBubble(entry, id);
        }
      } catch (e) { showError(e); }
    }

    async function refresh() {
      const raw = await api("listAgents");
      state.agents = Array.isArray(raw) ? raw : (raw?.agents || []);
      renderRoster();
      if (state.current && !state.agents.some((a) => a.id === state.current)) {
        state.current = null;
        $("title").textContent = "选一个 bot 或群";
        $("input").disabled = true;
        $("send").disabled = true;
      }
    }

    $("form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      if (!state.current || state.sending) return;
      const text = $("input").value.trim();
      if (!text) return;
      const agent = state.agents.find((a) => a.id === state.current);
      let targetId = state.current;
      if (!agent?.isGroup) {
        const hits = mentionedAgents(text).filter((a) => a.id !== state.current);
        if (hits.length === 1) targetId = hits[0].id;
      }
      const target = state.agents.find((a) => a.id === targetId);
      const prompt = $("nudge").checked && !target?.isGroup
        ? text + "\n\n只调用 SendMessage 回复用户（type=text）。一两句即可，不要调用其它工具。"
        : text;
      state.sending = true;
      $("send").disabled = true;
      showError("");
      try {
        $("input").value = "";
        closeMentionMenu();
        if (targetId !== state.current) await select(targetId);
        addBubble({ id: "local-" + Date.now(), kind: "message", role: "user", content: text }, targetId);
        await api("sendPrompt", { agentId: targetId, prompt });
      } catch (e) {
        showError(e);
      } finally {
        state.sending = false;
        $("send").disabled = false;
        $("input").focus();
      }
    });

    $("input").addEventListener("input", () => updateMentionMenu());
    $("input").addEventListener("click", () => updateMentionMenu());
    $("input").addEventListener("keydown", (ev) => {
      if (state.mention.open) {
        if (ev.key === "ArrowDown") {
          ev.preventDefault();
          state.mention.index = (state.mention.index + 1) % state.mention.items.length;
          renderMentionMenu();
          return;
        }
        if (ev.key === "ArrowUp") {
          ev.preventDefault();
          state.mention.index = (state.mention.index - 1 + state.mention.items.length) % state.mention.items.length;
          renderMentionMenu();
          return;
        }
        if (ev.key === "Enter" || ev.key === "Tab") {
          ev.preventDefault();
          const item = state.mention.items[state.mention.index];
          if (item) insertMention(item.name);
          return;
        }
        if (ev.key === "Escape") {
          ev.preventDefault();
          closeMentionMenu();
          return;
        }
      }
      if (ev.key === "Enter" && !ev.shiftKey) {
        if (ev.isComposing || ev.keyCode === 229) return;
        ev.preventDefault();
        $("form").requestSubmit();
      }
    });

    $("newBot").addEventListener("click", () => { $("botName").value = ""; $("botDesc").value = ""; $("botDlg").showModal(); });
    $("botCancel").addEventListener("click", () => $("botDlg").close());
    $("botOk").addEventListener("click", async () => {
      const name = $("botName").value.trim();
      if (!name) return;
      showError("");
      try {
        const created = await api("createAgent", { name, description: $("botDesc").value.trim() });
        $("botDlg").close();
        await refresh();
        const id = created?.agent?.id || created?.id;
        if (id) await select(id);
      } catch (e) { showError(e); }
    });

    $("newGroup").addEventListener("click", () => {
      $("groupName").value = "";
      const members = state.agents.filter((a) => !a.isGroup);
      $("memberList").innerHTML = members.map((a) =>
        `<label><input type="checkbox" value="${a.id}" /> ${a.name}</label>`
      ).join("") || "<div class='empty'>先建两个 bot</div>";
      $("groupDlg").showModal();
    });
    $("groupCancel").addEventListener("click", () => $("groupDlg").close());
    $("groupOk").addEventListener("click", async () => {
      const name = $("groupName").value.trim();
      const memberIds = [...$("memberList").querySelectorAll("input:checked")].map((el) => el.value);
      if (!name || memberIds.length < 1) return;
      showError("");
      try {
        const created = await api("createGroup", { name, memberAgentIds: memberIds });
        $("groupDlg").close();
        await refresh();
        const id = created?.agent?.id || created?.id;
        if (id) await select(id);
      } catch (e) { showError(e); }
    });

    function connectEvents() {
      const es = new EventSource("/events");
      es.onmessage = (msg) => {
        let ev;
        try { ev = JSON.parse(msg.data); } catch { return; }
        if (ev?.channel === "agents") refresh().catch(() => {});
        if (ev?.channel !== "transcript") return;
        const agentId = ev.payload?.agentId;
        const entry = ev.payload?.entry || ev.payload;
        if (agentId && agentId === state.current) addBubble(entry, agentId);
      };
      es.onerror = () => { /* browser retries */ };
    }

    (async () => {
      try {
        const health = await fetch("/health").then((r) => r.json());
        $("status").textContent = health?.ok
          ? ("本机网关 · " + (window.SDK_BOTS_MODEL || "openrouter"))
          : "网关异常";
        await refresh();
        connectEvents();
        const prefer = state.agents.find((a) => a.isGroup) || state.agents[0];
        if (prefer) await select(prefer.id);
      } catch (e) {
        $("status").textContent = "连不上网关";
        showError(e);
      }
    })();
  </script>
</body>
</html>
